[project]
name = "researchHub-academic-paper-intelligence-system"
version = "0.1.0"
description = "production-grade AI-powered ResearchHub system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.5",
    "python-dotenv==1.2.1",
    "langfuse==4.6.1",
    "FastAPI==0.121.0",
    "pydantic==2.12.4",
    "uvicorn[standard]==0.38.0",
    "langchain_postgres==0.0.16",
    "psycopg2-binary==2.9.11",
    "starlette>=0.40.0,<0.50.0",
    "pypdf==6.2.0",
    "beautifulsoup4==4.14.2",
    "llama-parse==0.6.83",
    "llama-index-core",
    "llama-index-llms-azure-openai",
    "llama-index-embeddings-azure-openai",
    "llama-index-vector-stores-postgres",
    "llama-index-multi-modal-llms-azure-openai",
    "pymupdf==1.24.0",
    "python-multipart==0.0.20",
    "sqlalchemy>=2.0.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "llama-index-retrievers-bm25",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "python-docx>=1.0.0",
    "llama-index-agent-openai>=0.4.12",
    "llama-index-tools-mcp",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.21.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "httpx >= 0.27.0",
]

[project.scripts]
demo-3-unified-multimodal = "main.app:main"
